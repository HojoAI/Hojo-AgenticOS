########## service properties for health ###########################################################
management.health.defaults.enabled=false
########## service properties for nacos discovery###################################################
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:nacos}
########## service properties for nacos config #####################################################
spring.cloud.nacos.config.server-addr=${NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:127.0.0.1:8848}}
spring.cloud.nacos.config.username=${NACOS_CONFIG_USERNAME:${NACOS_USERNAME:nacos}}
spring.cloud.nacos.config.password=${NACOS_CONFIG_PASSWORD:${NACOS_PASSWORD:nacos}}
spring.config.import[0]=nacos:example.properties?group=example
########## source properties for central-account service discovery ##################################
central.account.service.name=hojoai-webmvc-central-account
########## source properties for openfeign #########################################################
spring.cloud.openfeign.client.config.default.connect-timeout=10000
spring.cloud.openfeign.client.config.default.read-timeout=60000
########## source properties for rest template #####################################################
rest-template.connect-timeout=10000
rest-template.read-timeout=60000
########## source properties for redis #############################################################
spring.data.redis.database=0
spring.data.redis.host=${OMNIASST_REDIS_HOST}
spring.data.redis.password=${OMNIASST_REDIS_PASSWORD}
spring.data.redis.lettuce.pool.max-active=100
spring.data.redis.lettuce.pool.max-idle=20
spring.data.redis.lettuce.pool.max-wait=1000ms
spring.data.redis.lettuce.pool.min-idle=10
spring.data.redis.lettuce.shutdown-timeout=1000ms
spring.data.redis.port=6379
spring.data.redis.ssl.enabled=false
spring.data.redis.timeout=1000
########## oversea auth properties #################################################################
# Google（Client ID 与代理勿写入仓库，通过环境变量注入）
oversea.auth.google.client-id-ios=${OVERSEA_AUTH_GOOGLE_CLIENT_ID_IOS}
oversea.auth.google.client-id-android=${OVERSEA_AUTH_GOOGLE_CLIENT_ID_ANDROID}
oversea.auth.google.client-id-web=${OVERSEA_AUTH_GOOGLE_CLIENT_ID_WEB}
oversea.auth.google.proxy-host=${OVERSEA_AUTH_GOOGLE_PROXY_HOST:}
oversea.auth.google.proxy-port=${OVERSEA_AUTH_GOOGLE_PROXY_PORT:0}
# Apple
oversea.auth.apple.bundle-id=${OVERSEA_AUTH_APPLE_BUNDLE_ID}
# Amazon SES
oversea.auth.ses.region=${OVERSEA_AUTH_SES_REGION:us-east-1}
oversea.auth.ses.access-key=${OVERSEA_AUTH_SES_ACCESS_KEY}
oversea.auth.ses.secret-key=${OVERSEA_AUTH_SES_SECRET_KEY}
oversea.auth.ses.from-address=${OVERSEA_AUTH_SES_FROM_ADDRESS}
oversea.auth.mock.magic-link-on-send-failure=false
# Magic Link
oversea.auth.magic-link.base-url=${OVERSEA_AUTH_MAGIC_LINK_BASE_URL}