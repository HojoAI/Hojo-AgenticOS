########## service properties for health ###########################################################
management.health.defaults.enabled=false
########## service properties for nacos discovery###################################################
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:nacos}
########## service properties for nacos config #####################################################
spring.cloud.nacos.config.server-addr=${NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:127.0.0.1:8848}}
spring.cloud.nacos.config.username=${NACOS_CONFIG_USERNAME:${NACOS_USERNAME:nacos}}
spring.cloud.nacos.config.password=${NACOS_CONFIG_PASSWORD:${NACOS_PASSWORD:nacos}}
spring.config.import[0]=nacos:example.properties?group=example
########## service properties for datasource ########################################################
spring.datasource.url=${OMNIASST_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/hojoai?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
spring.datasource.username=${OMNIASST_DATASOURCE_USERNAME:root}
spring.datasource.password=${OMNIASST_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
########## redis service properties #################################################################
spring.data.redis.host=${OMNIASST_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${OMNIASST_REDIS_PORT:6379}
spring.data.redis.password=${OMNIASST_REDIS_PASSWORD}
spring.data.redis.database=6
spring.data.redis.timeout=3000
########## aliyun oss properties #################################################################
aliyun.oss.endpoint=${OMNIASST_MANAGEMENT_ALIYUN_OSS_ENDPOINT:https://oss-cn-hangzhou.aliyuncs.com}
aliyun.oss.access-key-id=${ALIYUN_OSS_ACCESS_KEY_ID}
aliyun.oss.access-key-secret=${ALIYUN_OSS_ACCESS_KEY_SECRET}
aliyun.oss.bucket-name=${ALIYUN_OSS_BUCKET_NAME}
########## LLM model properties #################################################################
llm.model.title-generation.url=${LLM_TITLE_GENERATION_URL:}
########## PostgreSQL config #####################################################
spring.datasource.postgresql.url=${OMNIASST_POSTGRESQL_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/omniasst}
spring.datasource.postgresql.username=${OMNIASST_POSTGRESQL_DATASOURCE_USERNAME:omniasst}
spring.datasource.postgresql.password=${OMNIASST_POSTGRESQL_DATASOURCE_PASSWORD:devpass}
########## Voiceprint config #####################################################
voiceprint.similarity.threshold=0.50
########## gRPC config #####################################################
grpc.central.provider.service.name=hojoai-grpc-central-provider