########## service properties for health ###########################################################
management.health.defaults.enabled=false
########## service properties for nacos discovery###################################################
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:nacos}
########## service properties for nacos config #####################################################
spring.cloud.nacos.config.server-addr=${NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:127.0.0.1:8848}}
spring.cloud.nacos.config.username=${NACOS_CONFIG_USERNAME:${NACOS_USERNAME:nacos}}
spring.cloud.nacos.config.password=${NACOS_CONFIG_PASSWORD:${NACOS_PASSWORD:nacos}}
spring.config.import[0]=nacos:example.properties?group=example
########## source properties for aliyun rtc ########################################################
aliyun.rtc.app-id=${ALIYUN_RTC_APP_ID}
aliyun.rtc.app-key=${ALIYUN_RTC_APP_KEY}
aliyun.rtc.token-expired-timestamp=43200
########## source properties for coze token config #################################################
coze.api.base=https://api.coze.cn
coze.oauth.token.ttl=86400
coze.oauth.client.id=${COZE_OAUTH_CLIENT_ID}
coze.oauth.public.key=${COZE_OAUTH_PUBLIC_KEY}
coze.oauth.private.key.path=classpath:private_key.pem

########## Redis config #####################################################
spring.data.redis.host=${OMNIASST_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${OMNIASST_REDIS_PORT:6379}
spring.data.redis.password=${OMNIASST_REDIS_PASSWORD}
spring.data.redis.database=6
spring.data.redis.timeout=3000

grpc.central.provider.service.name=hojoai-grpc-central-provider

########## hojoai model api config ############################################################
hojoai.model.api.url=${HOJOAI_MODEL_API_URL}

################ source properties for umeng config ##########################
umeng.push.app-key=${UMENG_PUSH_APP_KEY}
umeng.push.message-secret=${UMENG_PUSH_MESSAGE_SECRET}
umeng.push.master-secret=${UMENG_PUSH_MASTER_SECRET}
umeng.push.host=https://msgapi.umeng.com
umeng.push.production-mode=true

########## hojoai tts api ############################################################
hojoai.tts.api-key=${HOJOAI_TTS_API_KEY}
