########## service properties for health ###########################################################
management.health.defaults.enabled=false
########## service properties for nacos discovery###################################################
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:}
########## service properties for nacos config #####################################################
spring.cloud.nacos.config.server-addr=${NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:}}
spring.cloud.nacos.config.username=${NACOS_CONFIG_USERNAME:${NACOS_USERNAME:nacos}}
spring.cloud.nacos.config.password=${NACOS_CONFIG_PASSWORD:${NACOS_PASSWORD:nacos}}
spring.config.import[0]=nacos:example.properties?group=example
########## source properties for mysql #############################################################
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
########## source properties for mybatis plus ######################################################
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto
########## source properties for redis ############################################################
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.lettuce.pool.max-active=100
spring.data.redis.lettuce.pool.max-idle=20
spring.data.redis.lettuce.pool.max-wait=1000ms
spring.data.redis.lettuce.pool.min-idle=10
spring.data.redis.lettuce.shutdown-timeout=1000ms
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.ssl.enabled=false
spring.data.redis.timeout=1000
########## source properties for rest template #####################################################
rest-template.connect-timeout=10000
rest-template.read-timeout=60000
########## mock properties for captcha ##############################################################
captcha.mock.user-mobile=${CAPTCHA_MOCK_USER_MOBILE:}
captcha.mock.mobile-captcha=${CAPTCHA_MOCK_MOBILE_CAPTCHA:}
########## aliyun sms ##############################################################################
aliyun.sms.sign-name=${ALIYUN_SMS_SIGN_NAME:}
aliyun.sms.template-code=${ALIYUN_SMS_TEMPLATE_CODE:}
