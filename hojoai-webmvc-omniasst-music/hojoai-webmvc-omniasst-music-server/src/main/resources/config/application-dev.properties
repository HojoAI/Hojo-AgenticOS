########## service properties for nacos discovery###################################################
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:}
########## service properties for nacos config #####################################################
spring.cloud.nacos.config.server-addr=${NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:127.0.0.1:8848}}
spring.cloud.nacos.config.username=${NACOS_CONFIG_USERNAME:${NACOS_USERNAME:nacos}}
spring.cloud.nacos.config.password=${NACOS_CONFIG_PASSWORD:${NACOS_PASSWORD:}}
spring.config.import[0]=optional:nacos:example.properties?group=example

########## Redis Config ############################################################
spring.data.redis.host=${MUSIC_REDIS_HOST}
spring.data.redis.port=${MUSIC_REDIS_PORT:6379}
spring.data.redis.username=${MUSIC_REDIS_USERNAME:}
spring.data.redis.password=${MUSIC_REDIS_PASSWORD}
spring.data.redis.database=5
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms

########## Netease Cloud Music API Config ############################################################
netease.cloud.music.api.base-url=${NETEASE_API_BASE_URL:https://music.163.com}
netease.cloud.music.api.timeout=${NETEASE_API_TIMEOUT:30000}
netease.cloud.app-id=${NETEASE_APP_ID}
netease.cloud.app-secret=${NETEASE_APP_SECRET}
netease.cloud.private.key=${NETEASE_PRIVATE_KEY}

########## Dify Music Agent Config ############################################################
dify.api.url=${DIFY_API_URL}
dify.api.token=${DIFY_API_TOKEN}

########## OAuth2 state encryption (AES-128, exactly 16-byte UTF-8 key) ############################################################
netease.cloud.oauth.state-encrypt-key=${NETEASE_OAUTH_STATE_ENCRYPT_KEY}