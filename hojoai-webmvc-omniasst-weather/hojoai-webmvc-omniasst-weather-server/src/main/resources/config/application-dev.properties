########## service properties for health ###########################################################
management.health.defaults.enabled=false
########## service properties for nacos discovery###################################################
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD}
########## service properties for nacos config #####################################################
spring.cloud.nacos.config.server-addr=${NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR}}
spring.cloud.nacos.config.username=${NACOS_CONFIG_USERNAME:${NACOS_USERNAME:nacos}}
spring.cloud.nacos.config.password=${NACOS_CONFIG_PASSWORD:${NACOS_PASSWORD}}
spring.config.import[0]=nacos:example.properties?group=example
########## Dify Weather Agent Config ############################################################
dify.api.url=${DIFY_API_URL}
dify.api.token=${DIFY_API_TOKEN}
##########caiyun.weather Config ############################################################
caiyun.weather.base-url=https://api.caiyunapp.com
caiyun.weather.api-version=v2.6
caiyun.weather.token=${CAIYUN_WEATHER_TOKEN}
caiyun.weather.lang=zh_CN
caiyun.weather.unit=metric
caiyun.weather.dailysteps=15
caiyun.weather.hourlysteps=0
caiyun.weather.alert=false
caiyun.weather.connect-timeout-seconds=10
caiyun.weather.read-timeout-seconds=30
########## caiyun v3 Config############################################################
caiyun.lifeindex.base-url=https://singer.caiyunhub.com
caiyun.lifeindex.token=${caiyun.weather.token}
########## LLM Config############################################################
llm.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
llm.api-key=${LLM_API_KEY}
llm.model-name=qwen3-235b-a22b-instruct-2507
llm.max-tokens=8192
llm.timeout-seconds=30
########## amap.geo Config############################################################
amap.geo.base-url=https://restapi.amap.com
amap.geo.key=${AMAP_GEO_KEY}
amap.geo.timeout-seconds=10
