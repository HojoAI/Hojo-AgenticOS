########## service properties for health ###########################################################
management.health.defaults.enabled=false
########## service properties for nacos discovery###################################################
spring.cloud.nacos.discovery.server-addr=${HOJOAI_FOCUS_NACOS_SERVER_ADDR}
spring.cloud.nacos.discovery.username=${HOJOAI_FOCUS_NACOS_USERNAME:}
spring.cloud.nacos.discovery.password=${HOJOAI_FOCUS_NACOS_PASSWORD:}
########## service properties for nacos config #####################################################
spring.cloud.nacos.config.server-addr=${HOJOAI_FOCUS_NACOS_CONFIG_SERVER_ADDR:${spring.cloud.nacos.discovery.server-addr}}
spring.cloud.nacos.config.username=${HOJOAI_FOCUS_NACOS_CONFIG_USERNAME:${spring.cloud.nacos.discovery.username}}
spring.cloud.nacos.config.password=${HOJOAI_FOCUS_NACOS_CONFIG_PASSWORD:${spring.cloud.nacos.discovery.password}}
spring.config.import[0]=${HOJOAI_FOCUS_SPRING_CONFIG_IMPORT:nacos:omniasst.focus.properties?group=omniasst.focus}
########## service properties for datasource ########################################################
spring.datasource.url=${HOJOAI_FOCUS_DATASOURCE_URL}
spring.datasource.username=${HOJOAI_FOCUS_DATASOURCE_USERNAME}
spring.datasource.password=${HOJOAI_FOCUS_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
########## service properties for snowflake id generator #############################################
snowflake.datacenter-id=${HOJOAI_FOCUS_SNOWFLAKE_DATACENTER_ID:1}
snowflake.worker-id=${HOJOAI_FOCUS_SNOWFLAKE_WORKER_ID:1}
########## source properties for redis #############################################################
spring.data.redis.database=${HOJOAI_FOCUS_REDIS_DATABASE:0}
spring.data.redis.host=${HOJOAI_FOCUS_REDIS_HOST}
spring.data.redis.lettuce.pool.max-active=100
spring.data.redis.lettuce.pool.max-idle=20
spring.data.redis.lettuce.pool.max-wait=1000ms
spring.data.redis.lettuce.pool.min-idle=10
spring.data.redis.lettuce.shutdown-timeout=1000ms
spring.data.redis.username=${HOJOAI_FOCUS_REDIS_USERNAME:}
spring.data.redis.password=${HOJOAI_FOCUS_REDIS_PASSWORD:}
spring.data.redis.port=${HOJOAI_FOCUS_REDIS_PORT:6379}
spring.data.redis.ssl.enabled=${HOJOAI_FOCUS_REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=1000
########## service properties for ai #########################################################
spring.ai.openai.base-url=${HOJOAI_FOCUS_OPENAI_BASE_URL}
spring.ai.openai.api-key=${HOJOAI_FOCUS_OPENAI_API_KEY}
########## grpc provider service #################################################################
grpc.central.provider.service.name=${HOJOAI_FOCUS_GRPC_CENTRAL_PROVIDER_NAME:hojoai-grpc-central-provider}
########## service properties for feign #################################################################
hojoai.model.api.connect-timeout=10000
hojoai.model.api.read-timeout=120000
hojoai.model.api.follow-redirects=true
