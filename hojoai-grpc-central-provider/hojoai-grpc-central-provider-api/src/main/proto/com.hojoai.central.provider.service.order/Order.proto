syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.hojoai.central.provider.grpc";
option java_outer_classname = "OrderProto";
option objc_class_prefix = "HW";

package order;

service OrderService {
  // 创建订单
  rpc createOrder (CreateOrderRequestDTO) returns (CreateOrderRespDTO) {}
  // 获取订单详情
  rpc getOrderDetail (GetOrderDetailRequestDTO) returns (GetOrderDetailRespDTO) {}
  // 支付宝回调通知
  rpc alipayNotify (AlipayNotifyRequestDTO) returns (AlipayNotifyRespDTO) {}
  // 磐河回调通知
  rpc panheNotify (PanheNotifyRequestDTO) returns (PanheNotifyRespDTO) {}
}

message CreateOrderRequestDTO {
  string userId = 1;
  string orderAmount = 2;
  string cinemaId = 3;
  string filmId = 4;
  string showId = 5;
  repeated string seatIdList = 6;
  string alipayType = 7;
  bool acceptChangeSeat = 8;
  string phone = 9;
  string orderNo = 10;
}

message CreateOrderRespDTO {
  string orderNo = 1;
  string orderStr = 2;
  int64 expireTime = 3;
  bool success = 4;
  string errorMsg = 5;
}

message GetOrderDetailRequestDTO {
  string userId = 1;
  string orderNo = 2;
}

message GetOrderDetailRespDTO {
  string respJson = 1;
}

