message AlipayNotifyRequestDTO {
  map<string, string> paramMap = 1;
}

message AlipayNotifyRespDTO {
  bool success = 1;
}

message PanheNotifyRequestDTO {
  map<string, string> paramMap = 1;
}

message PanheNotifyRespDTO {
  bool success = 1;
  string movieDetailStr = 2;
}