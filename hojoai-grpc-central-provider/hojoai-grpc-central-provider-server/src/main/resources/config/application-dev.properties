########## service properties for grpc #############################################################
grpc.port=11103
########## service properties for health ###########################################################
management.health.defaults.enabled=false
########## service properties for nacos discovery###################################################
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:nacos}
spring.cloud.nacos.discovery.metadata.grpc-port=${grpc.port}
########## service properties for nacos config #####################################################
spring.cloud.nacos.config.server-addr=${NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:127.0.0.1:8848}}
spring.cloud.nacos.config.username=${NACOS_CONFIG_USERNAME:${NACOS_USERNAME:nacos}}
spring.cloud.nacos.config.password=${NACOS_CONFIG_PASSWORD:${NACOS_PASSWORD:nacos}}
spring.config.import[0]=nacos:example.properties?group=example
########## source properties for mysql #############################################################
spring.datasource.url=${DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/hojoai?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
spring.datasource.username=${DATASOURCE_USERNAME:root}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
########## source properties for mybatis plus ######################################################
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto
########## source properties for http #############################################################
rest-template.connect-timeout=10000
rest-template.read-timeout=60000
########## source properties for redis #############################################################
spring.data.redis.database=0
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.lettuce.pool.max-active=100
spring.data.redis.lettuce.pool.max-idle=20
spring.data.redis.lettuce.pool.max-wait=1000ms
spring.data.redis.lettuce.pool.min-idle=10
spring.data.redis.lettuce.shutdown-timeout=1000ms
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.port=6379
spring.data.redis.ssl.enabled=false
spring.data.redis.timeout=1000
########## source properties for panhe #############################################################
panhe.request.http.url=${PANHE_REQUEST_HTTP_URL}
panhe.request.http.appkey=${PANHE_REQUEST_HTTP_APPKEY}
panhe.request.http.secretKey=${PANHE_REQUEST_HTTP_SECRET_KEY}
panhe.callback.url=${PANHE_CALLBACK_URL}
########## alipay config ###########################################################################
alipay.app.id=${ALIPAY_APP_ID}
alipay.app.private.key=${ALIPAY_APP_PRIVATE_KEY}
alipay.public.key=${ALIPAY_PUBLIC_KEY}
alipay.open.api.url=${ALIPAY_OPEN_API_URL:https://openapi.alipay.com/gateway.do}
alipay.callback.url=${ALIPAY_CALLBACK_URL}
################ source properties for umeng config ##########################
umeng.push.app-key=${UMENG_PUSH_APP_KEY}
umeng.push.master-secret=${UMENG_PUSH_MASTER_SECRET}
umeng.push.host=https://msgapi.umeng.com
umeng.push.production-mode=true
umeng.push.default-activity=${UMENG_PUSH_DEFAULT_ACTIVITY:}
umeng.push.xiaomi.channel-id=${UMENG_PUSH_XIAOMI_CHANNEL_ID:}
umeng.push.xiaomi.activity=${UMENG_PUSH_XIAOMI_ACTIVITY:}
########## variflight flight ############################################################
flight.variflight.base-url=https://open-al.variflight.com/api/flight
flight.variflight.app-id=${VARIFLIGHT_APP_ID}
flight.variflight.app-security=${VARIFLIGHT_APP_SECURITY}
########## variflight train ############################################################
train.variflight.base-url=https://open-al.variflight.com/api/traintable
########## Firebase (FCM) ###############################################################
firebase.service-account.enabled=false
firebase.service-account.location=classpath:firebase-service-account.json
firebase.proxy.enabled=false
firebase.proxy.host=${FIREBASE_PROXY_HOST:}
firebase.proxy.port=3128
