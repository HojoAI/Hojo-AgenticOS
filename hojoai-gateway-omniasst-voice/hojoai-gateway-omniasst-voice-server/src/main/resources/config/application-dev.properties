########## service properties for health ###########################################################
management.health.defaults.enabled=false
########## service properties for nacos discovery###################################################
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:nacos}
########## service properties for nacos config #####################################################
spring.cloud.nacos.config.server-addr=${NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:127.0.0.1:8848}}
spring.cloud.nacos.config.username=${NACOS_CONFIG_USERNAME:${NACOS_USERNAME:nacos}}
spring.cloud.nacos.config.password=${NACOS_CONFIG_PASSWORD:${NACOS_PASSWORD:nacos}}
spring.config.import[0]=nacos:example.properties?group=example
########## speech properties ###################################################################
ai.tts.host=${HOJOAI_SPEECH_TTS_HOST}
ai.tts.api-key=${HOJOAI_TTS_API_KEY}
ai.asr.host=${HOJOAI_SPEECH_ASR_HOST}
ai.asr.api-key=${HOJOAI_ASR_API_KEY}
########## model properties for autoflow nlu#####################################################
autoflow.model.nlu.url=${AUTOFLOW_NLU_URL}
autoflow.model.nlu.authorization=${AUTOFLOW_NLU_AUTHORIZATION}
########## websocket heartbeat config #####################################################
websocket.heartbeat.interval=10
websocket.heartbeat.timeout-rounds=3
websocket.heartbeat.check-interval=10
########## OSS Audio Recording properties ############################################
oss.aliyun.audio-recording-enabled=true
oss.aliyun.endpoint=${ALIYUN_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
oss.aliyun.bucket-name=${ALIYUN_OSS_BUCKET_NAME}
oss.aliyun.access-key-id=${ALIYUN_OSS_ACCESS_KEY_ID}
oss.aliyun.access-key-secret=${ALIYUN_OSS_ACCESS_KEY_SECRET}
oss.aliyun.base-path=omniasst/voice
oss.aliyun.async-upload=true
oss.aliyun.max-duration-minutes=30
oss.aliyun.generate-presigned-url=true
oss.aliyun.presigned-url-expiration-hours=24
########## audio converter config #####################################################
audio.converter.enabled=true
########## Doubao TTS config #####################################################
doubao.tts.app-id=${DOUBAO_TTS_APP_ID}
doubao.tts.access-token=${DOUBAO_TTS_ACCESS_TOKEN}
doubao.tts.resource-id=seed-tts-2.0
########## PostgreSQL config #####################################################
spring.datasource.postgresql.url=${OMNIASST_POSTGRESQL_DATASOURCE_URL}
spring.datasource.postgresql.username=${OMNIASST_POSTGRESQL_DATASOURCE_USERNAME}
spring.datasource.postgresql.password=${OMNIASST_POSTGRESQL_DATASOURCE_PASSWORD}
########## Azure Speech config #####################################################
azure.speech.subscription-key=${AZURE_SPEECH_SUBSCRIPTION_KEY}
azure.speech.region=eastasia
azure.speech.session-timeout-ms=300000
azure.speech.recognized-wait-timeout-ms=2000
########## Redis config #####################################################
spring.data.redis.host=${OMNIASST_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${OMNIASST_REDIS_PORT:6379}
spring.data.redis.password=${OMNIASST_REDIS_PASSWORD}
spring.data.redis.database=6
spring.data.redis.timeout=3000
########## aliyun nls  ###########################################################
aliyun.nls.accessKeyId=${ALIYUN_NLS_ACCESS_KEY_ID}
aliyun.nls.accessKeySecret=${ALIYUN_NLS_ACCESS_KEY_SECRET}
aliyun.nls.appkey=${ALIYUN_NLS_APPKEY}
aliyun.nls.token=${ALIYUN_NLS_TOKEN}
########## MiniMax #####################################################
minimax.ai.api-key=${MINIMAX_AI_API_KEY}

