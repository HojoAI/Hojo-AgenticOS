########## system properties for active ############################################################
spring.profiles.active=@springProfilesActive@
########## system properties for server ############################################################
server.port=12007
server.servlet.context-path=/omniasst-meeting
spring.application.name=hojoai-webmvc-omniasst-meeting

# 未由 ExceptionHandler 兜底的错误也在 JSON 中带 message，便于预发/联调（勿在生产暴露敏感栈信息时可再收紧）
server.error.include-message=always

# commit 转发 management 时 multipart 文件名；须与 management 要求一致（当前为 WAV）
meeting.voiceprint.register.upload-original-filename=voiceprint.wav

