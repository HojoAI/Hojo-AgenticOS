########## system properties for active ############################################################
spring.profiles.active=@springProfilesActive@
########## system properties for server ############################################################
server.port=12011
server.servlet.context-path=/omniasst-headphone
spring.application.name=hojoai-webmvc-omniasst-headphone
########## character encoding configuration #######################################################
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
########## nacos config (disabled for standalone) ################################################
spring.config.import=optional:nacos:
spring.cloud.nacos.config.enabled=false
spring.cloud.nacos.discovery.enabled=false