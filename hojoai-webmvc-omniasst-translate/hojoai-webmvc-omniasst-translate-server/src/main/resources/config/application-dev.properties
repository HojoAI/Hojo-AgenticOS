########## service properties for health ###########################################################
management.health.defaults.enabled=false
########## service properties for nacos discovery###################################################
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:}
########## service properties for nacos config #####################################################
spring.cloud.nacos.config.server-addr=${NACOS_CONFIG_SERVER_ADDR:${NACOS_SERVER_ADDR:127.0.0.1:8848}}
spring.cloud.nacos.config.username=${NACOS_CONFIG_USERNAME:${NACOS_USERNAME:nacos}}
spring.cloud.nacos.config.password=${NACOS_CONFIG_PASSWORD:${NACOS_PASSWORD:}}
spring.config.import[0]=nacos:example.properties?group=example
########## websocket heartbeat config #####################################################
websocket.heartbeat.interval=10
websocket.heartbeat.timeout-rounds=3
websocket.heartbeat.check-interval=10
########## Redis config #####################################################
spring.data.redis.host=${TRANSLATE_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${TRANSLATE_REDIS_PORT:6379}
spring.data.redis.password=${TRANSLATE_REDIS_PASSWORD}
spring.data.redis.database=${TRANSLATE_REDIS_DATABASE:6}
spring.data.redis.username=${TRANSLATE_REDIS_USERNAME:}
spring.data.redis.timeout=3000
########## Database config #####################################################
spring.datasource.url=${TRANSLATE_DATASOURCE_URL}
spring.datasource.username=${TRANSLATE_DATASOURCE_USERNAME}
spring.datasource.password=${TRANSLATE_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
########## model properties for autoflow nlu#####################################################
autoflow.model.nlu.url=${AUTOFLOW_NLU_URL}
autoflow.model.nlu.authorization=${AUTOFLOW_NLU_AUTHORIZATION}
########## model properties for llm title generation#####################################################
llm.model.title-generation.url=${LLM_TITLE_GENERATION_URL:}

